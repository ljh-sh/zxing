[package]
name = "zxing"
version = "0.1.0"
authors = ["ljh-sh <lijunhao@x-cmd.com>"]
edition = "2021"
rust-version = "1.85"
description = "Local QR + 1D barcode decoder CLI — pure-Rust wrapper around the ZXing algorithm"
readme = "README.md"
homepage = "https://github.com/ljh-sh/zxing"
documentation = "https://github.com/ljh-sh/zxing"
license = "Apache-2.0"
repository = "https://github.com/ljh-sh/zxing"
keywords = ["qr", "qrcode", "barcode", "barcode-reader", "zxing"]
categories = ["command-line-utilities", "multimedia", "encoding"]
exclude = [
    ".release-artifacts/",
    ".github/",
    ".x-cmd/",
    "target/",
    "*.swp",
    "*.swo",
    "*~",
    ".DS_Store",
]

[[bin]]
name = "zxing"
path = "src/main.rs"

[dependencies]
# Pure-Rust port of ZXing. We only need decoders (qrcode + oned) + image
# loading + multi-barcode reader. Disable encoders (v0.1 decode-only),
# client_support, chrono-tz, fancy-regex, urlencoding, uriparse, serde
# — none are needed for v0.1.
#
# encoding_rs is REQUIRED: rxing's character_set module unconditionally
# references the encoding_rs `encode()` method on CharacterSet values;
# disabling it makes the crate fail to compile. There is no
# `no_character_set_support` build path that's compatible with multi-format
# decoding.
rxing = { version = "0.9", default-features = false, features = [
    "decoders",
    "qrcode",
    "oned",
    "multi_barcode_readers",
    "image",
    "image_formats",
    "encoding_rs",
] }
# Image crate re-exported via rxing's `image` feature is the same crate.
# We use it directly to load multiple formats into a DynamicImage for
# downstream luminance source construction.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "bmp",
    "tiff",
    "webp",
    "pnm",
] }
anyhow = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = "z"

[profile.test]
panic = "unwind"