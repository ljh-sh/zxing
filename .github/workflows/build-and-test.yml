# Build and test the zxing binary on every push / PR.
#
# Matrix: 6 targets — linux-musl (x86_64 + aarch64), macOS (x86_64 +
# aarch64), windows-gnu (x86_64 + aarch64). The whole repo is pure Rust
# (no C dependencies), so the only per-target differences are the
# linker flags and the cross-compile toolchain.

name: build-and-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cc: gcc
          - os: macos-latest
            target: x86_64-apple-darwin
            cc: clang
          - os: macos-latest
            target: aarch64-apple-darwin
            cc: clang
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run unit + integration tests
        run: cargo test --target ${{ matrix.target }} --all-features

  build:
    name: build (${{ matrix.target }})
    # No `needs: test` — build matrix runs in parallel with test. The
    # matrix is the slow path and the test job is the fast gate.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux gnu — primary CI host; produces glibc binary
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # Linux musl — preferred dist target (static binary)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            extra-deps: musl-tools
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            extra-deps: musl-tools
          # macOS — universal via two native builds
          - os: macos-13
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          # Windows — MinGW
          - os: windows-latest
            target: x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compile deps (Linux musl)
        if: matrix.extra-deps
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.extra-deps }}

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Smoke test
        shell: bash
        run: |
          set -e
          BIN="target/${{ matrix.target }}/release/zxing"
          if [[ "${{ matrix.os }}" == windows* ]]; then
            BIN="$BIN.exe"
          fi
          # Generate a QR with qrencode, decode with zxing, verify roundtrip
          qrencode -o /tmp/qr.png -s 10 -m 4 'https://ljh-sh.github.io/zxing'
          test "$( "$BIN" dec /tmp/qr.png )" = "$(printf '/tmp/qr.png\tQR_CODE\thttps://ljh-sh.github.io/zxing')"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: zxing-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/zxing*

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: cargo deny
        # v2 uses a cargo-deny release that supports Cargo.lock v4
        # (Cargo 1.93+ default). The v1 image ships an older cargo
        # that fails to parse lockfile v4 with "lock file version `4`
        # was found, but this version of Cargo does not understand
        # this lock file".
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  size:
    name: binary size budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install musl tools
        run: sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --target x86_64-unknown-linux-musl
      - name: Assert size < 4 MB
        run: |
          SIZE=$(stat -c %s target/x86_64-unknown-linux-musl/release/zxing)
          echo "zxing binary size: ${SIZE} bytes ($(($SIZE / 1024)) KiB)"
          test "$SIZE" -lt 4194304