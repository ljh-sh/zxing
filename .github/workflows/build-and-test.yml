# Build and test the zxing binary on every push / PR.
#
# Matrix: 6 targets — linux gnu (host), linux-musl (x86_64 + aarch64),
# macOS (x86_64 + aarch64), windows-gnu (x86_64). All cross-compile
# cases use `cargo-zigbuild` (Zig as the linker) so the host x86_64
# runner can produce aarch64-musl / aarch64-macos binaries without
# needing a separate musl-cross / osxcross toolchain.
#
# Pre-built binaries are stripped to keep the per-target artifact
# small. Every release artifact is signed with `cosign sign-blob`.

name: build-and-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, host)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-zigbuild
        run: cargo install --locked cargo-zigbuild
      - name: Run unit + integration tests
        run: cargo test --release --all-features

  build:
    name: build (${{ matrix.target }})
    # No `needs: test` — build matrix runs in parallel with test. The
    # matrix is the slow path and the test job is the fast gate.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux glibc — host native build (fast, no cross-toolchain)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # Linux musl — preferred dist target (static binary, smaller)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
          # macOS — native build per architecture
          - os: macos-13
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          # Windows — MinGW (deferred promotion in v0.2)
          - os: windows-latest
            target: x86_64-pc-windows-gnu
            continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-zigbuild
        run: cargo install --locked cargo-zigbuild

      - name: Build release (cargo-zigbuild for cross, cargo build for native)
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ] && [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ]; then
            cargo build --release --target ${{ matrix.target }} --locked
          else
            cargo zigbuild --release --target ${{ matrix.target }} --locked
          fi

      - name: Strip
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/zxing"
          [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          if command -v strip >/dev/null; then
            strip "$BIN" || true
          fi

      - name: Smoke test (roundtrip with qrencode)
        shell: bash
        run: |
          set -e
          BIN="target/${{ matrix.target }}/release/zxing"
          [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          # Generate a QR with qrencode, decode with zxing, verify roundtrip
          qrencode -o /tmp/qr.png -s 10 -m 4 'https://ljh-sh.github.io/zxing'
          ACTUAL="$("$BIN" dec /tmp/qr.png)"
          EXPECTED="$(printf '/tmp/qr.png\tQR_CODE\thttps://ljh-sh.github.io/zxing')"
          if [ "$ACTUAL" = "$EXPECTED" ]; then
            echo "Roundtrip OK: $ACTUAL"
          else
            echo "Roundtrip FAILED"
            echo "  expected: $EXPECTED"
            echo "  actual:   $ACTUAL"
            exit 1
          fi

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: zxing-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/zxing*

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: cargo deny
        # v2 uses a cargo-deny release that supports Cargo.lock v4
        # (Cargo 1.93+ default). The v1 image ships an older cargo
        # that fails to parse lockfile v4 with "lock file version `4`
        # was found, but this version of Cargo does not understand
        # this lock file".
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  size:
    name: binary size budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install musl tools
        run: sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --target x86_64-unknown-linux-musl
      - name: Assert size < 4 MB
        run: |
          SIZE=$(stat -c %s target/x86_64-unknown-linux-musl/release/zxing)
          echo "zxing binary size: ${SIZE} bytes ($(($SIZE / 1024)) KiB)"
          test "$SIZE" -lt 4194304